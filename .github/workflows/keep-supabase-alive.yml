name: Keep Supabase project alive

on:
  schedule:
    # Every 3 days at 05:00 UTC — Supabase free-tier projects auto-pause
    # after 7 days with no database activity, which silently broke the
    # registration form's document upload/save until someone noticed.
    - cron: "0 5 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping registrations table to keep the project active
        run: |
          curl -sf "https://byxylgasxyscobbyjoaz.supabase.co/rest/v1/registrations?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5eHlsZ2FzeHlzY29iYnlqb2F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MDYzNjQsImV4cCI6MjEwMDI4MjM2NH0.HBERm0mcWCfHOa8f074s6QRaVTKmiEmFiwbX4KLziMc" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5eHlsZ2FzeHlzY29iYnlqb2F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MDYzNjQsImV4cCI6MjEwMDI4MjM2NH0.HBERm0mcWCfHOa8f074s6QRaVTKmiEmFiwbX4KLziMc" \
            -o /dev/null -w "Supabase ping: HTTP %{http_code}\n"
